spring.application.name=atlantis-api
server.port=${PORT:8080}

# Encoding UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# H2 Database Config (Modo de compatibilidade MySQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# H2 Web Console Config (Acesse em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Preserva o camelCase das variaveis Java no banco sem converter para snake_case[cite: 5]
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.suppress_ddl_warnings=true
spring.jpa.open-in-view=false

# Jackson JSON
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.time-zone=UTC

# OpenAPI / Swagger Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Exposicao do endpoint de Health no Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Paginacao padrao
app.paginacao.tamanho-padrao=10