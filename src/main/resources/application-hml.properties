spring.application.name=atlantis-api
server.port=${PORT:8090}

# Encoding UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# MySQL Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/atlantis?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Forca o dialeto especifico do MySQL 5.7 para o Hibernate 6.x
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Preserva o camelCase das variaveis Java no banco sem converter para snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.suppress_ddl_warnings=true
spring.jpa.open-in-view=false

# Jackson JSON
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.time-zone=UTC

# OpenAPI / Swagger Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Exposição do endpoint de Health no Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Paginacao padrao
app.paginacao.tamanho-padrao=10